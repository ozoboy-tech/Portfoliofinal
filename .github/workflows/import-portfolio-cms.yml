name: Import de la distribution Decap 3.18.0
on:
  push:
    branches: [security/portfolio-admin-2026-11]
permissions:
  contents: write
jobs:
  import:
    if: github.repository == 'ozoboy-tech/Portfoliofinal'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
      - name: Importer et vérifier le paquet officiel
        run: |
          set -eu
          npm pack decap-cms@3.18.0 --ignore-scripts --pack-destination "$RUNNER_TEMP"
          tar -xzf "$RUNNER_TEMP/decap-cms-3.18.0.tgz" -C "$RUNNER_TEMP"
          for package in lodash lodash-es; do
            npm pack "$package@4.18.1" --silent --ignore-scripts --pack-destination "$RUNNER_TEMP"
            mkdir "$RUNNER_TEMP/$package"
            tar -xzf "$RUNNER_TEMP/$package-4.18.1.tgz" --strip-components=1 -C "$RUNNER_TEMP/$package"
          done
          node -e 'const fs=require("fs");const s=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+"/package/dist/decap-cms.js.map"));console.log("LODASH",s.sources.filter(x=>x.includes("lodash")).slice(0,5));'
          node tools/import-cms.mjs "$RUNNER_TEMP/package" "$RUNNER_TEMP/decap-cms-3.18.0.tgz"
          npm test
          npm run build
          git add -- admin/vendor licenses/vendor-manifest.json
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Met à jour Decap et conserve les sessions en mémoire'
            git push origin HEAD:refs/heads/security/portfolio-admin-2026-11
          fi
