name: Vérification du portfolio
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run build
      - name: Vérifier l'écran de connexion CMS avec Chrome
        run: |
          node tools/serve.mjs &
          server_pid=$!
          trap 'kill "$server_pid" || true' EXIT
          curl --retry 15 --retry-connrefused --retry-delay 1 -fsS http://127.0.0.1:4173/admin/ -o /dev/null
          google-chrome --headless --no-sandbox --disable-gpu --virtual-time-budget=15000 --dump-dom http://127.0.0.1:4173/admin/ > "$RUNNER_TEMP/admin.html"
          node -e 'const html=require("fs").readFileSync(process.env.RUNNER_TEMP+"/admin.html","utf8");require("node:assert/strict")(/<button\b[^>]*>[\s\S]*?GitHub[\s\S]*?<\/button>/i.test(html),"Bouton de connexion GitHub absent");'
  production:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
      - name: Vérifier les fichiers servis après déploiement Netlify
        run: |
          for attempt in {1..18}; do
            if node tools/check-production.mjs; then exit 0; fi
            sleep 15
          done
          exit 1
